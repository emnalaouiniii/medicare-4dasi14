server:
  port: 8081

spring:
  application:
    name: patient-service

  datasource:
    # La base est créée automatiquement au premier lancement
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/medicare_patient_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Eureka : désactivé tant que eureka-server n'est pas encore développé.
# Pour l'activer : EUREKA_ENABLED=true (ou mettre true ici).
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
