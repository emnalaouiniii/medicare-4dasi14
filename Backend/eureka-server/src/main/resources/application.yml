server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Le serveur ne s'enregistre pas lui-même
    register-with-eureka: false
    fetch-registry: false
  server:
    # Désactivé en développement pour voir tout de suite les services arrêtés
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
